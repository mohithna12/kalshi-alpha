[package]
name        = "kalshi-ingest"
description = "Kalshi authentication, REST discovery, and WebSocket market-data ingest. Read-only."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
kalshi-common = { workspace = true }

tokio             = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util      = { workspace = true }
reqwest           = { workspace = true }

rsa       = { workspace = true }
sha2      = { workspace = true }
pkcs8     = { workspace = true }
rand_core = { workspace = true }
signature = { workspace = true }
base64    = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }

anyhow    = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
chrono    = { workspace = true }
rand      = { workspace = true }

[dev-dependencies]
# Signing tests generate their own throwaway keypair at runtime rather than
# committing key material to the repository.
rsa        = { workspace = true }
rand_core  = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
